<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Admin Authentication · RoamSonio</title>
<style>
body{margin:0;background:#F8F5ED;color:#0B2D4A;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
.card{width:min(520px,90%);background:#FFFDF9;border:1px solid #D9E0E7;border-radius:18px;padding:32px;text-align:center}
h1{font-family:Georgia,serif;font-size:34px;margin:0 0 12px}p{color:#58718A;line-height:1.6;font-size:14px}
</style></head><body><main class="card"><h1>Securing Master Admin</h1><p id="status">Completing the secure Google sign-in…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const client=supabase.createClient("https://vqtqchxoecrahtrnoocy.supabase.co","sb_publishable_DyiQBLmIyGMBXCeJ9KKgSg_TFWO5vsy",{auth:{storageKey:"roamsonio-master-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce"}});
const status=document.getElementById("status");
(async()=>{
  try{
    const code=new URLSearchParams(location.search).get("code");
    if(code){
      const flowId=new URLSearchParams(location.search).get("sb_flow_id");
      const result=await client.auth.exchangeCodeForSession(code,flowId?{flowId}:undefined);
      if(result.error) throw result.error;
    }
    const session=await client.auth.getSession();
    if(session.error) throw session.error;
    if(!session.data.session) throw new Error("Master Admin session was not established.");
    location.replace("master-account.html");
  }catch(e){
    console.error(e);
    status.textContent="Master Admin sign-in could not be completed: "+(e?.message||"Unknown authentication error")+". Please return to Master Admin sign-in and try again.";
  }
})();
</script></body></html>
