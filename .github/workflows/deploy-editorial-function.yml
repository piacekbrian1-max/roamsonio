name: Deploy RoamSonio Editorial Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-editorial-function:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy editorial suggestion generator
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          supabase functions deploy editorial-suggestion-generator --project-ref vqtqchxoecrahtrnoocy --no-verify-jwt
