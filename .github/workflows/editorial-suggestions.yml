name: Weekly RoamSonio Editorial Suggestions

on:
  # GitHub cron uses UTC. Run at both possible 09:00 Eastern UTC slots;
  # the clock guard below permits only the slot that is 09:00 in New York.
  schedule:
    - cron: "0 13 * * 0"
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-roamsonio-editorial-suggestions
  cancel-in-progress: false

jobs:
  generate-editorial-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep the weekly run at 9 AM Eastern
        id: clock
        shell: bash
        run: |
          HOUR="$(TZ=America/New_York date +%H)"
          if [ "$HOUR" != "09" ]; then
            echo "run_now=false" >> "$GITHUB_OUTPUT"
            echo "This UTC schedule slot is not 09:00 Eastern; skip to avoid duplicate runs."
          else
            echo "run_now=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate up to three protected editorial drafts
        if: steps.clock.outputs.run_now == 'true' || github.event_name == 'workflow_dispatch'
        env:
          EDITORIAL_JOB_SECRET: ${{ secrets.EDITORIAL_JOB_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$EDITORIAL_JOB_SECRET" ]; then
            echo "::error::Add the EDITORIAL_JOB_SECRET repository Actions secret."
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $EDITORIAL_JOB_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://vqtqchxoecrahtrnoocy.supabase.co/functions/v1/editorial-suggestion-generator")
          echo "$response"
          created=$(printf '%s' "$response" | jq -r '.created // 0')
          status=$(printf '%s' "$response" | jq -r '.status // "unknown"')
          echo "Weekly suggestion generation status: $status; private drafts created: $created"
          echo "Photo preparation runs independently on its scheduled workflow. Nothing is approved or published by this job."
